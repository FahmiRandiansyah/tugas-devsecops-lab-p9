kname: Container Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ✅ KUNCI UTAMA: Beri izin eksplisit untuk menulis ke tab Security
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.secure -t my-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "my-app:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          # ✅ Kita set "0" (Soft Fail) dulu agar pipeline HIJAU dan bisa upload SARIF
          exit-code: "0" 

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Selalu upload, meskipun step sebelumnya gagal
        with:
          sarif_file: "trivy-results.sarif"
          category: "container-scanning"
